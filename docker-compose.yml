services:
  db:
    image: postgres:16-alpine
    container_name: anzu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-anzu}
      POSTGRES_PASSWORD: ${PGPASSWORD:-anzu123}
      POSTGRES_DB: ${PGDATABASE:-anzu_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-anzu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anzu-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: db
      PGDATABASE: ${PGDATABASE:-anzu_db}
      PGUSER: ${PGUSER:-anzu}
      PGPASSWORD: ${PGPASSWORD:-anzu123}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src:ro
      - ./database:/app/database:ro
      - /app/node_modules

volumes:
  pgdata: